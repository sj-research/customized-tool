<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>구역 변천</title>
<link rel="stylesheet" href="css/prep.css?v=0.24.0">
<script>
  window.APP_VERSION = "0.24.0";
  function showFatal(msg) {
    var el = document.getElementById("fatal");
    if (!el) { el = document.createElement("div"); el.id = "fatal"; document.documentElement.appendChild(el); }
    el.style.cssText = "position:fixed;top:0;left:0;right:0;z-index:99;background:#b3261e;color:#fff;padding:10px;font:13px/1.4 sans-serif;white-space:pre-wrap";
    el.textContent = "오류 (v" + window.APP_VERSION + "): " + msg;
  }
  window.addEventListener("error", function (e) { showFatal(e.message + (e.filename ? "\n" + e.filename.split("/").pop() + ":" + e.lineno : "")); });
  window.addEventListener("unhandledrejection", function (e) { showFatal(String(e.reason && e.reason.message || e.reason)); });
</script>
</head>
<body>
<div id="map"></div>

<div class="bar">
  <div class="tabs">
    <button data-v="v1">1차</button>
    <button data-v="v2">2차</button>
    <button data-v="v3">3차</button>
  </div>
  <div class="head">
    <div class="h-title"><span id="vTitle"></span> <small id="vDate"></small></div>
    <div class="h-why" id="vWhy"></div>
  </div>
</div>

<div id="legend"></div>

<div class="strip">
  <div class="s-item"><span class="s-lbl">구역</span><b id="sZones"></b></div>
  <div class="s-item"><span class="s-lbl">구역 안 업장</span><b id="sIn"></b></div>
  <div class="s-item"><span class="s-lbl">구역 밖</span><b id="sOut"></b></div>
  <div class="s-note">같은 명단 <span id="sTotal"></span>곳을 세 시점 경계로 갈랐을 때</div>
</div>

<div id="error"></div>

<script src="js/common.js?v=0.24.0"></script>
<script src="js/prep.js?v=0.24.0"></script>
</body>
</html>
