<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>현장 지도</title>
<link rel="stylesheet" href="css/field.css?v=0.7.0">
<script>
  // 아이폰에는 개발자 도구가 없어서, 스크립트 오류를 화면 맨 위에 보여준다
  window.APP_VERSION = "0.7.0";
  function showFatal(msg) {
    var el = document.getElementById("fatal");
    if (!el) { el = document.createElement("div"); el.id = "fatal"; document.documentElement.appendChild(el); }
    el.style.cssText = "position:fixed;top:0;left:0;right:0;z-index:99;background:#b3261e;color:#fff;padding:10px;font:13px/1.4 sans-serif;white-space:pre-wrap";
    el.textContent = "오류 (v" + window.APP_VERSION + "): " + msg;
  }
  window.addEventListener("error", function (e) { showFatal(e.message + (e.filename ? "\n" + e.filename.split("/").pop() + ":" + e.lineno : "")); });
  window.addEventListener("unhandledrejection", function (e) { showFatal(String(e.reason && e.reason.message || e.reason)); });
</script>
</head>
<body>
<header id="counts" class="counts"></header>
<div class="searchbar">
  <input id="q" type="search" enterkeyhint="search" placeholder="상호명 검색" autocomplete="off">
  <button id="clearQ" class="clear" aria-label="검색어 지우기" hidden>✕</button>
</div>

<main class="map-wrap">
  <div id="map"></div>
  <div id="searchResults" class="search-results" hidden></div>
  <div id="zoomHint" class="zoom-hint">확대하면 업장이 보입니다</div>
  <button id="locBtn" class="loc" aria-label="현재 위치 따라가기"><span></span></button>
</main>

<section id="sheet" class="sheet" hidden></section>
<section id="pinSheet" class="sheet" hidden></section>

<footer class="bottom">
  <button id="resetTrack">경로 초기화</button>
  <button id="openSettings">설정</button>
</footer>

<div id="settings" class="modal" hidden>
  <div class="modal-body">
    <h3>설정 <small class="muted">v0.7.0</small></h3>
    <p id="settingsMsg" class="warn"></p>
    <label>Apps Script 웹 앱 URL <input id="setUrl" type="url" autocomplete="off"></label>
    <label>접근 토큰 <input id="setToken" type="password" autocomplete="off"></label>
    <label>카카오 JavaScript 키 <input id="setKakao" type="text" autocomplete="off"></label>
    <p class="muted small">입력값은 이 기기 브라우저에만 저장됩니다. 코드와 저장소에는 올라가지 않습니다.</p>
    <div class="row">
      <button id="closeSettings" class="secondary">닫기</button>
      <button id="saveSettings" class="primary">저장하고 다시 열기</button>
    </div>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<script src="js/common.js?v=0.7.0"></script>
<script src="js/field.js?v=0.7.0"></script>
</body>
</html>
